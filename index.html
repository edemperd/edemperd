<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЕДЕМ В ПЕРДЬ — Карaоке</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,300;0,400;0,700;1,300&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #e8ff00;
  --accent2: #ff3c3c;
  --bg: #080806;
  --text: #f0ede6;
  --muted: #4a4a42;
  --surface: #111110;
  --border: rgba(255,255,255,.08);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }

/* ── VIEWS ── */
.view { display: none; width: 100%; min-height: 100vh; flex-direction: column; }
.view.active { display: flex; }

/* ══════════════════════════════════
   СПИСОК ТРЕКОВ
══════════════════════════════════ */
#view-list { overflow-y: visible; display: flex; flex-direction: column; }
#view-player { position: fixed !important; inset: 0; background: #000; z-index: 100; }

.hero {
  position: relative; flex-shrink: 0;
  height: 48vh; min-height: 240px; max-height: 420px;
}
.hero.compact {
  height: 56px !important; min-height: 56px !important; max-height: 56px !important;
  overflow: hidden;
}
.hero.compact .hero-bg, .hero.compact .hero-grain, .hero.compact .hero-overlay { display: none; }
.hero.compact .hero-content { flex-direction: row; align-items: center; padding: 0 20px; bottom: 0; top: 0; gap: 12px; }
.hero.compact .hero-eyebrow, .hero.compact .hero-desc, .hero.compact .hero-line { display: none; }
.hero.compact .hero-title { font-size: 22px; letter-spacing: 2px; }
.hero-bg {
  position: absolute; inset: 0;
  background-image: url('photos/IMG_4386.jpeg');
  background-size: cover; background-position: center 20%;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(0,0,0,.3) 0%, rgba(8,8,6,.0) 40%, rgba(8,8,6,1) 100%);
}
.hero-grain {
  position: absolute; inset: 0; opacity: .35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
}
.hero-content {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 28px 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.hero-eyebrow {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 5px; color: var(--accent);
  text-transform: uppercase; opacity: .9;
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 14vw, 110px);
  letter-spacing: 4px; line-height: .92;
  color: var(--text);
}
.hero-title em { color: var(--accent); font-style: normal; }
.hero-desc {
  font-size: 11px; letter-spacing: 2px; color: var(--muted);
  font-weight: 300; margin-top: 2px;
}
.hero-line {
  width: 40px; height: 1px; background: var(--accent); margin-top: 4px;
}

/* Треклист */
.tracklist-wrap {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.tracklist-hdr {
  padding: 18px 28px 10px;
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 5px; color: var(--muted);
  text-transform: uppercase; border-bottom: 1px solid var(--border);
}
.track {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 28px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  -webkit-tap-highlight-color: rgba(232,255,0,.05);
}
.track:active { background: rgba(232,255,0,.04); }
.track-num {
  font-family: 'Courier Prime', monospace;
  font-size: 10px; color: var(--muted);
  width: 20px; flex-shrink: 0; text-align: right;
}
.track-info { flex: 1; min-width: 0; }
.track-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px; letter-spacing: 2.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-meta { font-size: 10px; color: var(--muted); margin-top: 2px; font-weight: 300; }
.track-icon { color: var(--muted); font-size: 16px; flex-shrink: 0; transition: color .12s; }
.track:active .track-icon { color: var(--accent); }
  .track-no-lyrics { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--muted); margin-top: 3px; }

/* ══════════════════════════════════
   ПЛЕЕР
══════════════════════════════════ */
#view-player { position: relative; background: #000; }

.ss-slide {
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity 1.4s ease;
  overflow: hidden;
  will-change: opacity;
}
.ss-slide.ss-active { opacity: 1; }
.ss-slide.ss-instant { transition: none; }

/* Слой размытого фона (для вертикальных фото и видео contain) */
.ss-blur {
  position: absolute; inset: -30px;
  background-size: cover; background-position: center;
  filter: blur(22px) brightness(.4) saturate(.7);
  transform: scale(1.15);
}
/* Основное изображение поверх */
.ss-img {
  position: absolute; inset: 0;
  background-size: contain; background-position: center; background-repeat: no-repeat;
}
/* Видео */
.ss-video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transition: object-fit 0s;
}
.ss-video.ss-contain { object-fit: contain; }

/* Автоскрытие UI плеера */
.phdr, .pcontrols { transition: opacity .5s ease; }
#view-player.ui-hidden .phdr,
#view-player.ui-hidden .pcontrols { opacity: 0; pointer-events: none; }

/* fit-btn — всегда в углу, не скрывается */
#fit-btn {
  position: fixed; top: 16px; right: 16px; z-index: 200;
  background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25);
  color: rgba(255,255,255,.8); font-size: 11px; letter-spacing: 1px;
  padding: 6px 12px; cursor: pointer; font-family: inherit;
  backdrop-filter: blur(8px);
  display: none;
}
.pbottom-grad {
  position: fixed; left: 0; right: 0; bottom: 0; height: 60%;
  background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.8) 55%, rgba(0,0,0,.98) 100%);
  z-index: 2; pointer-events: none;
}
.ptop-grad {
  position: fixed; left: 0; right: 0; top: 0; height: 30%;
  background: linear-gradient(to top, transparent, rgba(0,0,0,.6));
  z-index: 2; pointer-events: none;
}

/* шапка плеера */
.phdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: 16px 20px 10px;
  display: flex; align-items: center; gap: 12px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.back-btn {
  background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.15);
  color: var(--text); padding: 7px 14px;
  font-family: 'Courier Prime', monospace; font-size: 10px;
  letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(4px);
  transition: border-color .15s; flex-shrink: 0;
}
.back-btn:hover { border-color: var(--accent); }
.p-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 17px;
  letter-spacing: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.snav { display: flex; gap: 8px; flex-shrink: 0; }
.cb {
  background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.15);
  color: var(--text); padding: 7px 14px;
  font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px;
  cursor: pointer; backdrop-filter: blur(4px);
}
.cb:hover { border-color: var(--accent); color: var(--accent); }

/* лирика */
.plyrics {
  position: fixed; bottom: 130px; left: 0; right: 0;
  z-index: 10; text-align: center;
  padding: 0 clamp(16px, 5vw, 60px);
  pointer-events: none;
  overflow: hidden;
}
.kline {
  display: block; font-family: 'Montserrat', sans-serif; font-weight: 300;
  font-size: clamp(22px, 4.5vw, 56px); line-height: 1.3;
  min-height: 1.3em; word-break: break-word; overflow-wrap: break-word;
  white-space: normal;
  text-shadow: 0 2px 20px rgba(0,0,0,.8);
  transition: opacity .2s;
}
.kline.next {
  font-size: clamp(14px, 2.8vw, 30px);
  color: rgba(255,255,255,.3);
  margin-top: 10px; opacity: .7;
}

/* word-level карaоке */
.kword { position: relative; display: inline; color: rgba(255,255,255,.2); white-space: pre-wrap; }
.kword-lit {
  position: absolute; left: 0; top: 0;
  color: var(--accent); text-shadow: 0 0 40px rgba(232,255,0,.35);
  clip-path: inset(0 100% 0 0); white-space: pre-wrap; pointer-events: none;
}
/* line-level заливка */
.kline-anim {
  background-image: linear-gradient(to right, var(--accent) 0%, rgba(255,255,255,.2) 0%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none;
}

/* контролы */
.pcontrols {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  padding: 14px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px;
  background: linear-gradient(to top, rgba(0,0,0,.9) 0%, transparent 100%);
}
.play-btn {
  background: none; border: 1px solid rgba(255,255,255,.2); color: var(--text);
  width: 46px; height: 46px; font-size: 18px; cursor: pointer; flex-shrink: 0;
  transition: border-color .15s, color .15s;
}
.play-btn:hover { border-color: var(--accent); color: var(--accent); }
.pw { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.progress-bar {
  width: 100%; height: 3px; background: rgba(255,255,255,.15); cursor: pointer;
  position: relative;
}
.progress-fill { height: 100%; background: var(--accent); width: 0%; pointer-events: none; }
.trow {
  font-size: 9px; color: var(--muted);
  font-family: 'Courier Prime', monospace;
  display: flex; justify-content: space-between;
  letter-spacing: 1px;
}

/* ══════ АДАПТИВ ══════ */
@media (max-width: 600px) {
  .hero-content { padding: 0 20px 16px; }
  .track { padding: 12px 20px; }
  .tracklist-hdr { padding: 14px 20px 8px; }
  .snav { display: flex; }
  .kline { font-size: clamp(20px, 5.5vw, 36px); }
  .kline.next { font-size: clamp(13px, 3.5vw, 22px); }
}

/* Компактная шапка при скролле */
#sticky-header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(8,8,6,.95); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: none; align-items: center; gap: 12px;
}
#sticky-header.visible { display: flex; }
.sticky-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; letter-spacing: 3px; color: var(--accent);
}
.sticky-hint {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 2px; color: var(--muted);
  margin-left: auto;
}

/* Трек — drag handle только в режиме редактирования */
.track-drag { 
  cursor: grab; color: var(--muted); font-size: 14px; 
  padding: 4px 0; flex-shrink: 0;
  display: none;
}
body.edit-order .track-drag { display: block; }
body.edit-order .track { cursor: default; }
.track-drag:active { cursor: grabbing; }
.track.dragging { opacity: .35; }
.track.drag-over { border-top: 2px solid var(--accent); }
#edit-order-btn.active { color: var(--accent); border-color: var(--accent); }

/* ══════ СЛЕД. ТРЕК ОВЕРЛЕЙ ══════ */
#next-track-overlay {
  position: fixed; inset: 0; z-index: 50;
  display: none; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding-bottom: 80px;
  pointer-events: none;
}
#next-track-overlay.visible { display: flex; pointer-events: all; }
.next-track-btn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 4px;
  background: rgba(232,255,0,.92); color: #000;
  border: none; padding: 16px 40px;
  cursor: pointer;
  animation: fadeSlideUp .6s ease forwards;
}
.next-track-label {
  font-family: 'Courier Prime', monospace;
  font-size: 11px; letter-spacing: 2px;
  color: rgba(255,255,255,.5);
  margin-bottom: 12px;
  animation: fadeSlideUp .6s ease .1s both;
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- СПИСОК -->
<div id="view-list" class="view active">
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-grain"></div>
    <div class="hero-content">
      <div class="hero-eyebrow">★ панк-туризм ★ 25.04.2026 ★</div>
      <div class="hero-title">ЕДЕМ<br>В <em>ПЕРДЬ</em></div>
      <div class="hero-desc">КАРAОКЕ — ПОЙ ВМЕСТЕ С НАМИ</div>
      <div class="hero-line"></div>
    </div>
  </div>
  <div class="tracklist-wrap" id="tracklist-wrap">
    <div id="sticky-header">
      <div class="sticky-title">ЕДЕМ В <span style="color:var(--text)">ПЕРДЬ</span></div>
      <div class="sticky-hint">перетащи чтобы изменить порядок</div>
    </div>
    <div class="tracklist-hdr" style="display:flex;align-items:center;justify-content:space-between">
      <span>Сетлист</span>
      <button id="edit-order-btn" onclick="toggleEditOrder()" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:2px;padding:4px 10px;cursor:pointer">ПОРЯДОК</button>
    </div>
    <div id="tracklist"></div>
  </div>
</div>

<!-- ПЛЕЕР -->
<div id="view-player" class="view">
  <div id="ss-container" style="position:fixed;inset:0;z-index:0;overflow:hidden;background:#000">
    <div id="ss-a" class="ss-slide"></div>
    <div id="ss-b" class="ss-slide"></div>
  </div>
  <div class="ptop-grad"></div>
  <div class="pbottom-grad"></div>
  <button id="fit-btn" class="ss-fit-btn" onclick="toggleFit()">⊞ FILL</button>
  <div class="phdr">
    <button class="back-btn" onclick="exitPl()">← НАЗАД</button>
    <div class="p-title" id="ptitle"></div>
    <div class="snav" id="snav"></div>
  </div>
  <div class="plyrics">
    <div class="kline active" id="kline-active"></div>
    <div class="kline next" id="kline-next"></div>
  </div>
  <div class="pcontrols">
    <button class="play-btn" id="cplay" onclick="togglePlay()">▶</button>
    <div class="pw">
      <div class="progress-bar" onclick="seekTo(event)">
        <div class="progress-fill" id="pf"></div>
      </div>
      <div class="trow"><span id="tc2">0:00</span><span id="tt">0:00</span></div>
    </div>
  </div>
  <div id="next-track-overlay">
    <div class="next-track-label" id="next-track-label"></div>
    <button class="next-track-btn" onclick="playNextTrack()">ЕДЕМ ДАЛЬШЕ →</button>
  </div>
</div>

<audio id="aud"></audio>
<script src="songs-data.js"></script>
<script>
// songs-data.js задаёт window.SONGS_DATA
const SONGS_BASE = (typeof PUBLISHED !== 'undefined' && PUBLISHED.length) ? PUBLISHED : [];

// Загружаем порядок из localStorage
function loadOrder() {
  try {
    const saved = localStorage.getItem('evp-order');
    if (!saved) return SONGS_BASE;
    const ids = JSON.parse(saved);
    const ordered = ids.map(id => SONGS_BASE.find(s => s.id === id)).filter(Boolean);
    // Добавляем новые песни которых нет в сохранённом порядке
    SONGS_BASE.forEach(s => { if (!ordered.find(x => x.id === s.id)) ordered.push(s); });
    return ordered;
  } catch { return SONGS_BASE; }
}

function saveOrder() {
  localStorage.setItem('evp-order', JSON.stringify(SONGS.map(s => s.id)));
}

const SONGS = loadOrder();

const aud = document.getElementById('aud');
let pId = null, pWordLines = [], pLastLineIdx = -1, raf = null;

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
}

function renderList() {
  const el = document.getElementById('tracklist');
  if (!SONGS.length) {
    el.innerHTML = '<div style="padding:40px 28px;color:#4a4a42;font-size:12px;letter-spacing:2px;font-family:\'Bebas Neue\',sans-serif">СКОРО</div>';
    return;
  }

  const durations = {};
  let loaded = 0;
  const total = SONGS.length;

  function updateTrackDuration(id, dur) {
    durations[id] = dur;
    const el = document.getElementById('dur-' + id);
    if (el) el.textContent = fmt(dur);
    loaded++;
    if (loaded === total) {
      const sum = Object.values(durations).reduce((a,b) => a+b, 0);
      const footer = document.getElementById('tracklist-footer');
      if (footer) footer.textContent = 'ИТОГО: ' + fmt(sum);
    }
  }

  el.innerHTML = SONGS.map((s, i) => {
    const hasLyrics = s.lyrics && s.lyrics.some(l => l.text && l.text.trim());
    const noLyricsMsg = !hasLyrics
      ? `<div class="track-no-lyrics">вы нормальные люди? текста нет</div>` : '';
    return `<div class="track" data-id="${s.id}" onclick="trackClick(event,'${s.id}')">
      <div class="track-drag" title="Перетащи чтобы переместить">⠿</div>
      <div class="track-num">${String(i+1).padStart(2,'0')}</div>
      <div class="track-info">
        <div class="track-name">${s.title}</div>
        <div class="track-meta"><span id="dur-${s.id}">—:——</span></div>
        ${noLyricsMsg}
      </div>
      <div class="track-icon">›</div>
    </div>`;
  }).join('') + `<div id="tracklist-footer" style="padding:16px 28px;font-family:'Courier Prime',monospace;font-size:10px;color:var(--muted);letter-spacing:3px;border-top:1px solid var(--border);margin-top:8px"></div>`;

  SONGS.forEach(s => {
    if (!s.audioPath) { updateTrackDuration(s.id, 0); return; }
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => updateTrackDuration(s.id, a.duration);
    a.onerror = () => updateTrackDuration(s.id, 0);
    a.src = s.audioPath;
  });

  // Sticky header при скролле
  const wrap = document.getElementById('tracklist-wrap');
  if (wrap) {
    wrap.addEventListener('scroll', () => {
      const sh = document.getElementById('sticky-header');
      if (sh) sh.classList.toggle('visible', wrap.scrollTop > 10);
    });
  }

  // Drag and drop — только через handle ⠿
  let dragSrc = null;
  let wasDragged = false;
  el.querySelectorAll('.track').forEach(row => {
    row.draggable = false;
    const handle = row.querySelector('.track-drag');
    if (handle) {
      handle.addEventListener('mousedown', () => { if (_editOrderMode) row.draggable = true; });
      handle.addEventListener('touchstart', () => { if (_editOrderMode) row.draggable = true; }, {passive:true});
    }
    row.addEventListener('dragstart', e => {
      if (!_editOrderMode) { e.preventDefault(); return; }
      dragSrc = row;
      wasDragged = false;
      setTimeout(() => row.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.draggable = false;
      row.classList.remove('dragging');
      el.querySelectorAll('.track').forEach(r => r.classList.remove('drag-over'));
      _wasDragged = true;
      setTimeout(() => { _wasDragged = false; }, 300);
      const newIds = [...el.querySelectorAll('.track')].map(r => r.dataset.id);
      newIds.forEach((id, i) => {
        const from = SONGS.findIndex(s => s.id === id);
        if (from !== i) SONGS.splice(i, 0, SONGS.splice(from, 1)[0]);
      });
      saveOrder();
      el.querySelectorAll('.track').forEach((r, i) => {
        const num = r.querySelector('.track-num');
        if (num) num.textContent = String(i+1).padStart(2,'0');
      });
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      if (row !== dragSrc) row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (dragSrc && dragSrc !== row) el.insertBefore(dragSrc, row);
    });
    row.addEventListener('click', e => {
      if (wasDragged) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  });
}

let _wasDragged = false;
let _editOrderMode = false;

function toggleEditOrder() {
  _editOrderMode = !_editOrderMode;
  document.body.classList.toggle('edit-order', _editOrderMode);
  const btn = document.getElementById('edit-order-btn');
  btn.textContent = _editOrderMode ? '✓ ГОТОВО' : 'ПОРЯДОК';
  btn.classList.toggle('active', _editOrderMode);
  if (_editOrderMode) {
    // Скроллим наверх
    document.getElementById('tracklist-wrap').scrollTop = 0;
    window.scrollTo(0, 0);
  } else {
    saveOrder();
  }
}

function trackClick(e, id) {
  if (_editOrderMode) return;
  if (e.target.classList.contains('track-drag')) return;
  if (_wasDragged) return;
  playFrom(id);
}

function playFrom(id) {
  // Скрываем оверлей если виден
  document.getElementById('next-track-overlay').classList.remove('visible');
  clearTimeout(nextTrackTimer);

  const s = SONGS.find(x => x.id === id);
  if (!s) return;
  pId = id;
  const pLines = s.lyrics.filter(l => l.time != null).sort((a,b) => a.time - b.time);
  pWordLines = pLines.map(l => ({ text: l.text, time: l.time, endTime: l.endTime || null, words: l.words || null }));
  pLastLineIdx = -2;
  document.getElementById('ptitle').textContent = s.title;

  // Слайдшоу
  ssClear();
  if (s.mediaFolder) {
    const S3B = 'https://storage.yandexcloud.net/edemperd';
    fetch(`${S3B}?prefix=${encodeURIComponent(s.mediaFolder+'/')}`)
      .then(r => r.text())
      .then(text => {
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        const keys = [...xml.getElementsByTagName('Key')].map(k => k.textContent).filter(k => {
          const name = k.split('/').pop();
          return name && /\.(jpg|jpeg|png|webp|gif|heic|heif|mp4|mov|webm)$/i.test(name);
        });
        if (keys.length) ssStart(keys.map(k => S3B+'/'+k));
      }).catch(() => {});
  } else if (s.mediaFiles?.length) {
    ssStart(s.mediaFiles);
  } else if (s.photoPath) {
    ssStart([s.photoPath]);
  }

  aud.src = s.audioPath || '';
  aud.currentTime = 0;
  aud.onended = onTrackEnded;
  buildNav();
  showView('player');
  document.getElementById('fit-btn').style.display = 'block';
  aud.play().catch(() => {});
  document.getElementById('cplay').textContent = '⏸';
  resetUiTimer();
  if (raf) cancelAnimationFrame(raf);
  loop();
  document.addEventListener('keydown', plKey);
}

let nextTrackTimer = null;

function onTrackEnded() {
  const i = SONGS.findIndex(s => s.id === pId);
  const hasNext = i >= 0 && i < SONGS.length - 1;
  if (!hasNext) return;
  const next = SONGS[i + 1];
  // Показываем оверлей через 2 секунды
  nextTrackTimer = setTimeout(() => {
    const label = document.getElementById('next-track-label');
    if (label) label.textContent = next.title;
    document.getElementById('next-track-overlay').classList.add('visible');
  }, 2000);
}

function playNextTrack() {
  const i = SONGS.findIndex(s => s.id === pId);
  if (i >= 0 && i < SONGS.length - 1) playFrom(SONGS[i + 1].id);
}

let ssFitMode = 'cover';
const FIT_MODES = ['cover', 'contain'];
const FIT_LABELS = { cover: '⊞ FILL', contain: '⊡ FIT' };

function toggleFit() {
  const idx = FIT_MODES.indexOf(ssFitMode);
  ssFitMode = FIT_MODES[(idx + 1) % FIT_MODES.length];
  const btn = document.getElementById('fit-btn');
  btn.textContent = FIT_LABELS[ssFitMode];
  document.querySelectorAll('.ss-video').forEach(v => {
    v.classList.remove('ss-contain');
    if (ssFitMode === 'contain') v.classList.add('ss-contain');
  });
}

// Автоскрытие UI плеера через 3 сек
let uiHideTimer = null;
function resetUiTimer() {
  const player = document.getElementById('view-player');
  if (!player.classList.contains('active')) return;
  player.classList.remove('ui-hidden');
  clearTimeout(uiHideTimer);
  uiHideTimer = setTimeout(() => player.classList.add('ui-hidden'), 3000);
}
document.getElementById('view-player').addEventListener('mousemove', resetUiTimer);
document.getElementById('view-player').addEventListener('touchstart', resetUiTimer, {passive:true});
document.getElementById('view-player').addEventListener('click', resetUiTimer);

function loop() { updatePl(); raf = requestAnimationFrame(loop); }

function updatePl() {
  const t = aud.currentTime, dur = aud.duration || 1;
  document.getElementById('pf').style.width = (t / dur * 100) + '%';
  document.getElementById('tc2').textContent = fmt(t);
  document.getElementById('tt').textContent = fmt(dur);

  let ai = -1;
  for (let i = 0; i < pWordLines.length; i++) {
    if (pWordLines[i].time <= t) ai = i; else break;
  }

  if (ai !== pLastLineIdx) {
    pLastLineIdx = ai;
    const nextLine = ai + 1 < pWordLines.length ? pWordLines[ai + 1] : null;
    document.getElementById('kline-next').textContent = nextLine ? nextLine.text : '';
    const activeEl = document.getElementById('kline-active');
    if (ai < 0) { activeEl.innerHTML = ''; return; }
    const line = pWordLines[ai];
    const hasWords = line.words && line.words.some(w => w.start !== null);
    if (hasWords) {
      activeEl.innerHTML = line.words.map((w, wi) =>
        `<span class="kword" id="kw-${wi}">${w.word}\u00a0<span class="kword-lit" id="kwl-${wi}">${w.word}\u00a0</span></span>`
      ).join('');
    } else {
      activeEl.innerHTML = `<span class="kline-anim" id="kline-fill">${line.text}</span>`;
    }
  }

  if (ai < 0) return;
  const line = pWordLines[ai];
  const lineStart = line.time;
  const lineEnd = pWordLines[ai].endTime ?? (ai + 1 < pWordLines.length ? pWordLines[ai + 1].time : dur);
  const hasWords = line.words && line.words.some(w => w.start !== null);

  if (hasWords) {
    line.words.forEach((w, wi) => {
      const el = document.getElementById('kwl-' + wi);
      if (!el) return;
      if (w.start === null) { el.style.clipPath = 'inset(0 100% 0 0)'; return; }
      if (t >= w.end) el.style.clipPath = 'inset(0 0% 0 0)';
      else if (t >= w.start) {
        const p = (t - w.start) / Math.max(w.end - w.start, 0.01);
        el.style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(1)}% 0 0)`;
      } else el.style.clipPath = 'inset(0 100% 0 0)';
    });
  } else {
    const el = document.getElementById('kline-fill');
    if (!el) return;
    const p = Math.max(0, Math.min((t - lineStart) / Math.max(lineEnd - lineStart, 0.5), 1));
    el.style.backgroundImage = `linear-gradient(to right, var(--accent) ${(p*100).toFixed(1)}%, rgba(255,255,255,.2) ${(p*100).toFixed(1)}%)`;
  }
}

function togglePlay() {
  if (aud.paused) {
    aud.play().catch(()=>{});
    document.getElementById('cplay').textContent = '⏸';
    document.querySelectorAll('#ss-a video, #ss-b video').forEach(v => v.play().catch(()=>{}));
  } else {
    aud.pause();
    document.getElementById('cplay').textContent = '▶';
    clearTimeout(ssTimer); ssTimer = null;
    document.querySelectorAll('#ss-a video, #ss-b video').forEach(v => v.pause());
  }
}
function seekTo(e) {
  const r = e.currentTarget.getBoundingClientRect();
  aud.currentTime = ((e.clientX - r.left) / r.width) * (aud.duration || 0);
}
function plKey(e) { if (e.code === 'Space') { e.preventDefault(); togglePlay(); } }
function exitPl() {
  if (raf) cancelAnimationFrame(raf);
  aud.pause(); document.removeEventListener('keydown', plKey);
  ssClear();
  document.getElementById('fit-btn').style.display = 'none';
  clearTimeout(nextTrackTimer);
  document.getElementById('next-track-overlay').classList.remove('visible');
  clearTimeout(uiHideTimer);
  document.getElementById('view-player').classList.remove('ui-hidden');
  showView('list');
}
function buildNav() {
  const nav = document.getElementById('snav');
  const i = SONGS.findIndex(s => s.id === pId);
  nav.innerHTML = '';
  if (i > 0) { const b = document.createElement('button'); b.className='cb'; b.textContent='◀'; b.onclick=()=>playFrom(SONGS[i-1].id); nav.appendChild(b); }
  if (i < SONGS.length-1) { const b = document.createElement('button'); b.className='cb'; b.textContent='▶'; b.onclick=()=>playFrom(SONGS[i+1].id); nav.appendChild(b); }
}

renderList();



// ── SLIDESHOW ─────────────────────────────────────────
let ssFiles = [], ssIdx = 0, ssTimer = null, ssCurActive = 'a';
const SS_INTERVAL = 6000;
const SS_SHORT_VIDEO = 8;

function ssIsVideo(url) { return /\.(mp4|mov|webm)$/i.test(url); }

function ssStart(files) {
  ssClear();
  ssFiles = [...files];
  for (let i = ssFiles.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [ssFiles[i],ssFiles[j]] = [ssFiles[j],ssFiles[i]];
  }
  ssIdx = 0;
  if (!ssFiles.length) return;
  ssShowSlide(ssFiles[0], true);
}

function ssShowSlide(url, first) {
  clearTimeout(ssTimer); clearInterval(ssTimer); ssTimer = null;

  const next = ssCurActive === 'a' ? 'b' : 'a';
  const elNext = document.getElementById('ss-'+next);
  const elCur = document.getElementById('ss-'+ssCurActive);

  elNext.innerHTML = '';
  elNext.classList.remove('ss-active');

  const isSingleFile = ssFiles.length === 1;

  if (ssIsVideo(url)) {
    const vid = document.createElement('video');
    vid.src = url; vid.autoplay = true; vid.muted = true;
    vid.playsInline = true; vid.loop = false;
    vid.className = 'ss-video';
    if (ssFitMode === 'contain') vid.classList.add('ss-contain');

    if (isSingleFile) {
      // Единственный файл — воспроизводим полностью, потом заново
      vid.onended = () => ssAdvance();
    } else {
      // Несколько файлов — короткие до конца, длинные режем до 8 сек
      vid.onloadedmetadata = () => {
        if (vid.duration <= SS_SHORT_VIDEO) {
          vid.onended = () => ssAdvance();
        } else {
          ssTimer = setTimeout(() => ssAdvance(), SS_SHORT_VIDEO * 1000);
        }
      };
    }

    elNext.appendChild(vid);
    
  } else {
    const blur = document.createElement('div');
    blur.className = 'ss-blur';
    blur.style.backgroundImage = `url(${url})`;
    const img = document.createElement('div');
    img.className = 'ss-img';
    img.style.backgroundImage = `url(${url})`;
    elNext.appendChild(blur);
    elNext.appendChild(img);
    
    if (!isSingleFile) ssTimer = setTimeout(() => ssAdvance(), SS_INTERVAL);
    // Единственное фото — просто висит
  }

  void elNext.offsetWidth;
  elNext.classList.add('ss-active');

  if (!first && elCur) {
    setTimeout(() => {
      elCur.style.transition = 'opacity 1.4s ease';
      elCur.style.opacity = '0';
      setTimeout(() => {
        elCur.innerHTML = '';
        elCur.style.opacity = '';
        elCur.style.transition = '';
        elCur.classList.remove('ss-active');
      }, 1500);
    }, 300);
  }

  ssCurActive = next;
}

function ssAdvance() {
  if (!ssFiles.length) return;
  ssIdx = (ssIdx+1) % ssFiles.length;
  ssShowSlide(ssFiles[ssIdx], false);
}

function ssClear() {
  clearTimeout(ssTimer); clearInterval(ssTimer); ssTimer = null;
  ssCurActive = 'a';
  const btn = document.getElementById('fit-btn');
  if (btn) btn.style.display = 'none';
  ['a','b'].forEach(id => {
    const el = document.getElementById('ss-'+id);
    if (el) { el.innerHTML = ''; el.style.opacity = ''; el.style.transition = ''; el.classList.remove('ss-active'); }
  });
}
</script>
